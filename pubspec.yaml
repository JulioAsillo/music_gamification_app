name: music_gamification_app
description: App de música local con gamificación y tracking
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 🎵 REPRODUCCIÓN DE AUDIO
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.13
  audio_service: ^0.18.15

  # 📁 ACCESO A ARCHIVOS Y PERMISOS
  permission_handler: ^11.3.1
  path_provider: ^2.1.4

  # 🎨 METADATOS DE AUDIO
  audio_metadata_reader: ^1.4.2         # ✅ VERSIÓN CORRECTA

  # 💾 BASE DE DATOS LOCAL
  drift: ^2.20.2
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0

  # 🧠 MANEJO DE ESTADO
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 🧭 NAVEGACIÓN
  go_router: ^14.6.2

  # 📊 GRÁFICOS
  fl_chart: ^0.70.1

  # 🎨 UI/UX
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.3

  # 🔧 UTILIDADES
  intl: ^0.20.2
  equatable: ^2.0.7
  uuid: ^4.5.1
  collection: ^1.18.0

  # 🔔 NOTIFICACIONES
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # 🏗️ CODE GENERATION
  build_runner: ^2.4.13
  drift_dev: ^2.28.0
  riverpod_generator: ^2.4.3
  riverpod_lint: ^2.3.13

flutter:
  uses-material-design: true
