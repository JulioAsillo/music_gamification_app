name: music_gamification_app
description: App de música local con gamificación y tracking
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 🎵 REPRODUCCIÓN DE AUDIO
  # (just_audio_background eliminado: chocaba con audio_service, que es el que se usa)
  just_audio: ^0.10.6
  audio_service: ^0.18.19

  # 📁 ACCESO A ARCHIVOS Y PERMISOS
  permission_handler: ^12.0.1   # 13.x exige compileSdk 37 y AGP 9; se sube cuando migremos Gradle
  path_provider: ^2.1.5

  # 🎨 METADATOS DE AUDIO
  audio_metadata_reader: ^1.4.2

  # 💾 BASE DE DATOS LOCAL
  # (drift_flutter eliminado: la conexión usa NativeDatabase directamente)
  drift: ^2.35.2
  sqlite3_flutter_libs: ^0.5.40
  path: ^1.9.0

  # 🧠 MANEJO DE ESTADO (Riverpod 3)
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # 🧭 NAVEGACIÓN (se empieza a usar en la Fase 3)
  go_router: ^18.1.0

  # 📊 GRÁFICOS (se empieza a usar en la Fase 5)
  fl_chart: ^1.2.0

  # 🎨 UI/UX
  google_fonts: ^6.3.2

  # 💾 PREFERENCIAS (tema y acento)
  shared_preferences: ^2.5.6

  # 🔧 UTILIDADES
  intl: ^0.20.2
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # 🏗️ CODE GENERATION
  build_runner: ^2.5.4
  drift_dev: ^2.35.0
  riverpod_generator: ^4.0.9
  # riverpod_lint ahora se instala como plugin en analysis_options.yaml

  # 🎨 GENERADOR DE ICONOS
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

# 🎨 CONFIGURACIÓN DE ICONOS
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1a1a2e"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

